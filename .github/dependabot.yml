version: 2

# Dependabot configuration for FUSE.
#
# We monitor two ecosystems:
#   - NuGet packages referenced from FUSE/FUSE.csproj and
#     FUSE.Tests/FUSE.Tests.csproj. The game-shipped
#     <Reference Include="…"> entries (Assembly-CSharp, UnityEngine.*,
#     Definition, etc.) are <HintPath> resolutions to the local Railroader
#     install — Dependabot doesn't see them, which is what we want; those
#     follow the game's version, not NuGet's.
#   - GitHub Actions referenced in .github/workflows/.
#
# Schedule is weekly (Monday early-morning UTC) to avoid weekend noise
# and to land in time for the maintainer's normal work cadence. Minor
# and patch updates within a package family are grouped into one PR
# per ecosystem; majors stay separate so they get the review attention
# they deserve.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: nuget
      include: scope
    # ABI-pinned packages: ignore major-version bumps so Dependabot
    # does not propose changes that compile fine but break at runtime
    # against the game-bundled DLL of the same name. Specifically:
    #
    # - Serilog is referenced compile-time-only via ExcludeAssets="runtime"
    #   in FUSE.csproj. The game ships its own Serilog 2.0.0.0
    #   (PublicKeyToken 24c2f752a8e58a10) and our PatchingContext shim
    #   must type-check against THAT exact assembly identity so legacy
    #   StrangeCustoms plugins, which were compiled against the same
    #   2.0.0.0, can be hosted unchanged. Bumping our NuGet reference
    #   to Serilog 3.x or 4.x would change the assembly identity FUSE.dll
    #   references, and at runtime the CLR would fail to bind those
    #   references against the still-2.0.0.0 game DLL.
    #
    # If you ever need to bump Serilog, you must FIRST verify that the
    # game's bundled Serilog has moved to the new major (check
    # Railroader_Data/Managed/Serilog.dll's AssemblyVersion).
    ignore:
      - dependency-name: Serilog
        update-types:
          - version-update:semver-major
    groups:
      nuget-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Group all xunit-family packages (xunit, xunit.runner.*, xunit.analyzers)
      # together so a coordinated bump lands as one PR. Same for the
      # Microsoft.NET.Test.* family and the coverlet packages - they
      # version together upstream and shipping their bumps separately
      # tends to produce broken intermediate states.
      xunit:
        applies-to: version-updates
        patterns:
          - xunit*
      microsoft-test:
        applies-to: version-updates
        patterns:
          - Microsoft.NET.Test.*
          - Microsoft.TestPlatform.*
      coverlet:
        applies-to: version-updates
        patterns:
          - coverlet.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: actions
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
