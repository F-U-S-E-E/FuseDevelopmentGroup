version: 2

# Dependabot configuration for FUSE.
#
# We monitor two ecosystems:
#   - NuGet packages referenced from FUSE.csproj and FUSE.Tests/.csproj.
#     The game-shipped <Reference Include="…"> entries (Assembly-CSharp,
#     UnityEngine.*, Definition, etc.) are <HintPath> resolutions to the
#     local Railroader install — Dependabot doesn't see them, which is
#     what we want; those follow the game's version, not NuGet's.
#   - GitHub Actions referenced in .github/workflows/.
#
# Schedule is weekly (Monday early-morning UTC) to avoid weekend noise
# and to land in time for the maintainer's normal work cadence. Minor
# and patch updates within a package family are grouped into one PR
# per ecosystem; majors stay separate so they get the review attention
# they deserve.
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: nuget
      include: scope
    groups:
      nuget-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Group all xunit-family packages (xunit, xunit.runner.*, xunit.analyzers)
      # together so a coordinated bump lands as one PR. Same for the
      # Microsoft.NET.Test.* family and the coverlet packages — they
      # version together upstream and shipping their bumps separately
      # tends to produce broken intermediate states.
      xunit:
        applies-to: version-updates
        patterns:
          - xunit*
      microsoft-test:
        applies-to: version-updates
        patterns:
          - Microsoft.NET.Test.*
          - Microsoft.TestPlatform.*
      coverlet:
        applies-to: version-updates
        patterns:
          - coverlet.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: actions
      include: scope
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
