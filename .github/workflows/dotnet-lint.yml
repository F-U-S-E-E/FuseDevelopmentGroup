name: .NET Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR when a new commit lands.
concurrency:
  group: dotnet-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cs-lint:
    # ubuntu-latest is sufficient: tools/cs_lint.py is pure Python with no
    # third-party dependencies and does not touch the Unity-shipped DLLs.
    # Running here keeps the self-hosted runner free for the build job in
    # ci.yml and lets this check execute in parallel with the build.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # tools/cs_lint.py is the .NET-source counterpart to tools/json_lint.py.
      # It checks for objective whitespace defects only (final newline,
      # trailing whitespace, double UTF-8 BOM, tab characters inside the
      # leading indentation of space-indented files). It deliberately does
      # NOT run `dotnet format` — see the module docstring in cs_lint.py
      # for the rationale (FUSE uses column alignment and brace styles
      # that the Roslyn default formatter wants to flatten).
      - name: Run C# whitespace lint
        run: python tools/cs_lint.py
