name: Release

on:
  push:
    tags:
      - "mod-v*"

permissions:
  contents: write

# Serialize mod releases: the job reuses fixed working directories (staging,
# staging-livebridge) on the self-hosted runner, so overlapping runs could race
# and ship a corrupted archive. Never cancel an in-flight release.
concurrency:
  group: release-mod
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: self-hosted
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Parse semantic version from tag
        id: version
        shell: powershell
        env:
          # Pass the tag via the environment, not template expansion, so a
          # crafted tag name can't inject into the script before validation.
          # This step runs on the self-hosted runner, so the hardening matters.
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^mod-v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' must match mod-v<semver>, e.g. mod-v0.13.0 or mod-v1.0.0-rc.1."
          }

          $version = $Matches.version
          "version=$version" >> $env:GITHUB_OUTPUT

          # Treat anything in the 0.x series or with a pre-release suffix as a
          # GitHub pre-release. FUSE is still in beta so 0.10.0 ships as a
          # pre-release until a 1.0.0 GA tag.
          if ($version -match '^0\.' -or $version -match '-') {
            "is_prerelease=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "is_prerelease=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build FUSE mod (Release)
        shell: powershell
        # Build FUSE.Editor.csproj: it ProjectReferences FUSE.csproj, so
        # MSBuild builds FUSE.dll first and FUSE.Editor.dll second.
        run: dotnet build FUSE.Editor/FUSE.Editor.csproj -c Release -p:ModVersion=${{ steps.version.outputs.version }}

      - name: Package UMM mod zip
        id: package
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stagingRoot = Join-Path $PWD "staging"
          $modFolder = Join-Path $stagingRoot "FUSE"
          $archiveName = "FUSE-v$version.zip"
          $archivePath = Join-Path $PWD $archiveName

          if (Test-Path $stagingRoot) {
            Remove-Item $stagingRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $modFolder | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $modFolder 'assets') | Out-Null

          # Copy the runtime assembly and its stamped manifest. Source the
          # manifest from bin so the InjectModVersionIntoInfoJson target's
          # rewrite is what ships.
          Copy-Item "FUSE\bin\Release\net48\FUSE.dll" $modFolder
          Copy-Item "FUSE\bin\Release\net48\Info.json" $modFolder
          # FUSE.Editor.dll ships side-by-side with FUSE.dll; FUSE loads it
          # lazily from this folder via Assembly.LoadFrom after UMM boots.
          Copy-Item "FUSE.Editor\bin\Release\net48\FUSE.Editor.dll" $modFolder
          # FUSE.Converter.dll is referenced by the editor's Convert
          # button. Project-reference flows it to FUSE.Editor's output
          # naturally; the release step explicitly copies it so the
          # release zip is self-contained.
          Copy-Item "FUSE.Editor\bin\Release\net48\FUSE.Converter.dll" $modFolder

          # Schemas are referenced by FUSE.csproj and copied into bin. We re-copy
          # from source to avoid picking up any stale files left over in bin
          # between local dev builds.
          Copy-Item -Recurse "schemas" $modFolder

          Copy-Item "tools\assets\fuse_converter_icon.png" (Join-Path $modFolder 'assets\fuse_icon.png')

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          Compress-Archive -Path $modFolder -DestinationPath $archivePath -CompressionLevel Optimal

          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      # Gate the release on UMM compatibility before publishing to GitHub and Nexus:
      # the packaged zip must be loadable by Unity Mod Manager. scripts/Validate-ModPackage.cs
      # resolves the Info.json EntryMethod to a public static bool Load(ModEntry) against
      # the game's UnityModManager assembly (via MetadataLoadContext — no game launch) and
      # asserts the manifest + archive layout. Runs before the installer/exe builds below
      # so a bad package fails fast.
      - name: Validate mod package (UMM compatibility)
        shell: powershell
        env:
          # Pass the archive path + version through the environment rather than
          # ${{ }} template expansion, consistent with the TAG_NAME hardening in
          # the version-parse step above.
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Resolve the reference dir through the same Paths.user / GameDir the build
          # used, so the UnityModManager assembly set always matches this runner.
          $ummDir = (dotnet msbuild FUSE/FUSE.csproj -getProperty:UnityModManagerDir -nologo 2>$null | Select-Object -Last 1)
          if ($ummDir) { $ummDir = $ummDir.Trim() }
          Write-Host "UnityModManager reference dir: $ummDir"
          if ($ummDir -and (Test-Path $ummDir)) {
            dotnet run scripts/Validate-ModPackage.cs -- "$env:ARCHIVE_PATH" "$env:MOD_VERSION" "FUSE" "$ummDir"
          } else {
            Write-Host "UnityModManagerDir unresolved; falling back to validator env-based resolution."
            dotnet run scripts/Validate-ModPackage.cs -- "$env:ARCHIVE_PATH" "$env:MOD_VERSION"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The standalone editor ships in its own release lane (externaleditor-v*
      # tags, .github/workflows/release-externaleditor.yml) so it can be
      # versioned and shipped independently of the mod. Intentionally NOT
      # packaged here.

      # FUSE.LiveBridge is an optional in-game mod (net48) that hot-reloads the
      # editor's saves; it ships as its own UMM mod zip.
      - name: Package FUSE.LiveBridge mod zip
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet build FUSE.LiveBridge/FUSE.LiveBridge.csproj -c Release -p:ModVersion=$version -p:EnableModDeploy=false
          $stagingRoot = Join-Path $PWD "staging-livebridge"
          $modFolder = Join-Path $stagingRoot "FUSE.LiveBridge"
          if (Test-Path $stagingRoot) { Remove-Item $stagingRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $modFolder | Out-Null
          Copy-Item "FUSE.LiveBridge\bin\Release\net48\FUSE.LiveBridge.dll" $modFolder
          # FUSE.Core.dll is a runtime dependency of the bridge (ProjectReference); ship it too.
          Copy-Item "FUSE.LiveBridge\bin\Release\net48\FUSE.Core.dll" $modFolder
          Copy-Item "FUSE.LiveBridge\bin\Release\net48\Info.json" $modFolder
          $zip = "FUSE.LiveBridge-v$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $modFolder -DestinationPath $zip -CompressionLevel Optimal

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build FUSE-Converter.exe
        shell: powershell
        run: .\tools\build_converter_exe.ps1

      - name: Build FUSE-Installer.exe
        shell: powershell
        run: .\tools\build_installer_exe.ps1

      - name: Build FUSEConvertFolder.pyz
        run: python tools/build_folder_converter_pyz.py

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FUSE v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive_path }}
            dist/FUSE-Converter.exe
            dist/FUSE-Installer.exe
            dist/FUSEConvertFolder.pyz
            FUSE.LiveBridge-v${{ steps.version.outputs.version }}.zip

      # Uploads the same archive to the mod's Nexus Mods page.
      # Skipped automatically until the repo variable NEXUS_FILE_GROUP_ID is set.
      # Requires:
      #   - secret  NEXUSMODS_API_KEY    (https://www.nexusmods.com/settings/api-keys)
      #   - variable NEXUS_FILE_GROUP_ID (from "API Info" on the mod's Files tab)
      - name: Upload to Nexus Mods
        if: ${{ vars.NEXUS_FILE_GROUP_ID != '' }}
        uses: Nexus-Mods/upload-action@0bf670d75d46988c176c9bfacc94ca0144e0fe3f # v1.0.0-beta.7
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ vars.NEXUS_FILE_GROUP_ID }}
          filename: ${{ steps.package.outputs.archive_path }}
          version: ${{ steps.version.outputs.version }}
          display_name: FUSE v${{ steps.version.outputs.version }}
          description: |
            Release v${{ steps.version.outputs.version }}.
            See the GitHub release for the full changelog: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          file_category: main
          archive_existing_file: true
