name: Release

on:
  push:
    tags:
      - "mod-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable mod-v* tag to publish"
        required: true
        type: string

permissions:
  contents: write

# Serialize mod releases: the job reuses fixed working directories (staging,
# staging-livebridge) on the self-hosted runner, so overlapping runs could race
# and ship a corrupted archive. Never cancel an in-flight release.
concurrency:
  group: release-mod
  cancel-in-progress: false

jobs:
  build-and-release:
    # Release jobs wait for an organization reviewer before reaching the
    # self-hosted runner or receiving the repository-scoped Nexus credential.
    environment: nexus-release
    runs-on: self-hosted
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # workflow_dispatch is the recovery path for a tag whose original run
      # failed before publication. Push runs keep using the triggering tag.
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Verify release tag targets protected main
        id: verify_tag
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Existing-tag releases must be dispatched from protected main."
          }

          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^mod-v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' must match mod-v<semver>."
          }

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $encodedTag = [Uri]::EscapeDataString($tag)
          $refUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$encodedTag"
          $tagRef = Invoke-RestMethod -Method Get -Uri $refUri -Headers $headers
          $tagObject = $tagRef.object

          # Release tags are normally annotated. Peel nested tag objects until
          # the underlying commit is reached, with a hard limit for safety.
          for ($depth = 0; $tagObject.type -eq 'tag' -and $depth -lt 8; $depth++) {
            $tagUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/tags/$($tagObject.sha)"
            $tagObject = (Invoke-RestMethod -Method Get -Uri $tagUri -Headers $headers).object
          }

          if ($tagObject.type -ne 'commit' -or $tagObject.sha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not resolve release tag '$tag' to a commit."
          }

          # Compare tagCommit...main. GitHub reports 'identical' when the tag is
          # at main and 'ahead' when main has advanced beyond that tag. Both mean
          # the immutable release tag targets a commit on protected main.
          $tagCommit = $tagObject.sha
          $compareUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/compare/$tagCommit...main"
          $comparison = Invoke-RestMethod -Method Get -Uri $compareUri -Headers $headers
          if ($comparison.status -notin @('identical', 'ahead')) {
            throw "FUSE release tags must point to a commit on protected main."
          }

          "tag_commit=$tagCommit" >> $env:GITHUB_OUTPUT
          Write-Host "Verified $tag -> $tagCommit on protected main ($($comparison.status))."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin checkout to the commit the API guard resolved. This prevents a
          # mutable ref from changing between verification and archive download.
          ref: ${{ steps.verify_tag.outputs.tag_commit }}
          fetch-depth: 1
          # This lane only builds and publishes release assets (via the
          # GITHUB_TOKEN env the release action receives directly); nothing
          # pushes back to the repo, so don't leave the checkout token
          # persisted in .git/config on the self-hosted runner.
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
        env:
          # See the matching note in ci.yml: the default install root is not
          # writable by the self-hosted runner service account, so pin the SDK
          # install to the runner-owned tool cache. Without this the release
          # lane fails at SDK setup before it ever builds an artifact.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Parse semantic version from tag
        id: version
        shell: powershell
        env:
          # Pass the tag via the environment, not template expansion, so a
          # crafted tag name can't inject into the script before validation.
          # This step runs on the self-hosted runner, so the hardening matters.
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^mod-v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' must match mod-v<semver>, e.g. mod-v0.13.0 or mod-v1.0.0-rc.1."
          }

          $version = $Matches.version
          "version=$version" >> $env:GITHUB_OUTPUT

          # Release candidates publish as FULL releases, not GitHub prereleases.
          # GitHub defines the "Latest" badge and /releases/latest as the newest
          # non-draft, non-prerelease release, so a tag flagged prerelease can
          # never hold it — and we want testers landing on the repo front page
          # to get the current RC. Plain x.y.z tags publish as full releases for
          # the same reason (when everything is a prerelease GitHub hides the
          # Latest card entirely and shows only a bare tag count).
          #
          # Any OTHER prerelease suffix (-beta.2, -alpha.1) still publishes as a
          # GitHub prerelease. Both -rc.1 and -rc2 spellings are accepted.
          #
          # Note this does not affect the source FUSE/Info.json, which stays
          # pinned at 0.0.0 so an unstamped local build is recognizable as such
          # in UMM. See Directory.Build.targets.
          if (($version -match '-') -and ($version -notmatch '-rc\.?[0-9]+$')) {
            "is_prerelease=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "is_prerelease=false" >> $env:GITHUB_OUTPUT
          }

          # Separate from is_prerelease on purpose. Since RCs now publish as full
          # GitHub releases, is_prerelease is false for them, and gating Nexus on
          # it would push every release candidate to the public mod page. is_ga is
          # true only for a plain x.y.z tag, so Nexus only ever sees stable
          # releases.
          if ($version -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
            "is_ga=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "is_ga=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build FUSE mod (Release)
        shell: powershell
        run: dotnet build FUSE/FUSE.csproj -c Release -p:ModVersion=${{ steps.version.outputs.version }}

      - name: Package UMM mod zip
        id: package
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stagingRoot = Join-Path $PWD "staging"
          $modFolder = Join-Path $stagingRoot "FUSE"
          $archiveName = "FUSE-v$version.zip"
          $archivePath = Join-Path $PWD $archiveName

          if (Test-Path $stagingRoot) {
            Remove-Item $stagingRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $modFolder | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $modFolder 'assets') | Out-Null

          # Copy the runtime assembly and its stamped manifest. Source the
          # manifest from bin so the InjectModVersionIntoInfoJson target's
          # rewrite is what ships.
          Copy-Item "FUSE\bin\Release\net48\FUSE.dll" $modFolder
          Copy-Item "FUSE\bin\Release\net48\Info.json" $modFolder

          # Schemas are referenced by FUSE.csproj and copied into bin. We re-copy
          # from source to avoid picking up any stale files left over in bin
          # between local dev builds.
          Copy-Item -Recurse "schemas" $modFolder

          Copy-Item "tools\assets\fuse_converter_icon.png" (Join-Path $modFolder 'assets\fuse_icon.png')

          # FUSE ships under the AGPL-3.0, which requires conveying the license
          # text with the binary. Validate-ModPackage.cs enforces its presence.
          Copy-Item "LICENSE" $modFolder

          if (Test-Path $archivePath) {
            Remove-Item $archivePath -Force
          }

          # Deliberately NOT Compress-Archive: under Windows PowerShell 5.1 (the
          # `shell: powershell` default on this runner) it writes entry names with
          # backslashes, which makes UMM fail to UPDATE an already-installed copy of
          # the mod. See scripts/New-ModArchive.ps1 and issue #209.
          .\scripts\New-ModArchive.ps1 -Path $modFolder -DestinationPath $archivePath

          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      # Gate the release on UMM compatibility before publishing to GitHub and Nexus:
      # the packaged zip must be loadable by Unity Mod Manager. scripts/Validate-ModPackage.cs
      # resolves the Info.json EntryMethod to a public static bool Load(ModEntry) against
      # the game's UnityModManager assembly (via MetadataLoadContext — no game launch) and
      # asserts the manifest + archive layout. Runs before the installer/exe builds below
      # so a bad package fails fast.
      - name: Validate mod package (UMM compatibility)
        shell: powershell
        env:
          # Pass the archive path + version through the environment rather than
          # ${{ }} template expansion, consistent with the TAG_NAME hardening in
          # the version-parse step above.
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Resolve the reference dir through the same Paths.user / GameDir the build
          # used, so the UnityModManager assembly set always matches this runner.
          $ummDir = (dotnet msbuild FUSE/FUSE.csproj -getProperty:UnityModManagerDir -nologo 2>$null | Select-Object -Last 1)
          if ($ummDir) { $ummDir = $ummDir.Trim() }
          Write-Host "UnityModManager reference dir: $ummDir"
          # `dotnet run <file>.cs` caches the compiled file-based app under
          # %TEMP%\dotnet\runfile, in a directory keyed by the script's PATH rather
          # than its contents. On this long-lived self-hosted runner that path never
          # changes, and the up-to-date check failed to notice the edited script:
          # every mod-v1.0.0-rc.* dry run rejected the newly-shipped LICENSE using a
          # cached build of the validator's own pre-LICENSE allow-list, and --no-cache
          # alone did not defeat it. Purging the cache is what forces a cold build.
          # A release gate that silently validates stale code is worse than none.
          $runfileCache = Join-Path $env:TEMP 'dotnet\runfile'
          if (Test-Path $runfileCache) {
            Write-Host "Purging file-based app cache: $runfileCache"
            Remove-Item $runfileCache -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "validator sha256: $((Get-FileHash 'scripts/Validate-ModPackage.cs' -Algorithm SHA256).Hash)"

          if ($ummDir -and (Test-Path $ummDir)) {
            dotnet run --no-cache scripts/Validate-ModPackage.cs -- "$env:ARCHIVE_PATH" "$env:MOD_VERSION" "FUSE" "$ummDir"
          } else {
            Write-Host "UnityModManagerDir unresolved; falling back to validator env-based resolution."
            dotnet run --no-cache scripts/Validate-ModPackage.cs -- "$env:ARCHIVE_PATH" "$env:MOD_VERSION"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The standalone editor ships in its own release lane (externaleditor-v*
      # tags, .github/workflows/release-externaleditor.yml) so it can be
      # versioned and shipped independently of the mod. Intentionally NOT
      # packaged here.

      # FUSE.LiveBridge is an optional in-game mod (net48) that hot-reloads the
      # editor's saves; it ships as its own UMM mod zip.
      - name: Package FUSE.LiveBridge mod zip
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet build FUSE.LiveBridge/FUSE.LiveBridge.csproj -c Release -p:ModVersion=$version -p:EnableModDeploy=false
          $stagingRoot = Join-Path $PWD "staging-livebridge"
          $modFolder = Join-Path $stagingRoot "FUSE.LiveBridge"
          if (Test-Path $stagingRoot) { Remove-Item $stagingRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $modFolder | Out-Null
          Copy-Item "FUSE.LiveBridge\bin\Release\net48\FUSE.LiveBridge.dll" $modFolder
          # FUSE.Core.dll is a runtime dependency of the bridge (ProjectReference); ship it too.
          Copy-Item "FUSE.LiveBridge\bin\Release\net48\FUSE.Core.dll" $modFolder
          Copy-Item "FUSE.LiveBridge\bin\Release\net48\Info.json" $modFolder
          # Same AGPL conveyance requirement as the main mod zip.
          Copy-Item "LICENSE" $modFolder
          $zip = "FUSE.LiveBridge-v$version.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # Same forward-slash requirement as the core mod zip; the Live Bridge is
          # installed and updated through UMM too. See issue #209.
          .\scripts\New-ModArchive.ps1 -Path $modFolder -DestinationPath $zip

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build FUSE-Converter.exe
        shell: powershell
        run: .\tools\build_converter_exe.ps1

      # Bundle the core mod zip built by the "Package UMM mod zip" step into the
      # exe so a manual (double-click) run installs FUSE, while dragging a mod
      # zip onto it installs that mod. Path passed via env rather than ${{ }}
      # expansion, consistent with the hardening elsewhere in this workflow.
      - name: Build FUSE-Installer.exe
        shell: powershell
        env:
          FUSE_PAYLOAD: ${{ steps.package.outputs.archive_path }}
        run: .\tools\build_installer_exe.ps1 -FusePayload "$env:FUSE_PAYLOAD"

      - name: Build FUSEConvertFolder.pyz
        run: python tools/build_folder_converter_pyz.py

      # Everything in one download, for GitHub only. The Nexus archive below is
      # intentionally smaller: it contains the core mod and the self-contained
      # installer, while this bundle also serves package-author tooling and the
      # development bridge.
      - name: Package complete bundle zip
        id: bundle
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $stagingRoot = Join-Path $PWD "staging-complete"
          $archiveName = "FUSE-Complete-v$version.zip"
          $archivePath = Join-Path $PWD $archiveName

          if (Test-Path $stagingRoot) { Remove-Item $stagingRoot -Recurse -Force }
          $modsDir  = New-Item -ItemType Directory -Path (Join-Path $stagingRoot 'Mods') -Force
          $toolsDir = New-Item -ItemType Directory -Path (Join-Path $stagingRoot 'Tools') -Force

          # Reuse the exact staging folders the two mod zips were built from, so
          # the bundle can never drift from the individually published zips.
          Copy-Item -Recurse "staging\FUSE" $modsDir.FullName
          Copy-Item -Recurse "staging-livebridge\FUSE.LiveBridge" $modsDir.FullName

          Copy-Item "dist\FUSE-Converter.exe" $toolsDir.FullName
          Copy-Item "dist\FUSE-Installer.exe" $toolsDir.FullName
          Copy-Item "dist\FUSEConvertFolder.pyz" $toolsDir.FullName

          Copy-Item "LICENSE" $stagingRoot
          Copy-Item "docs\INSTALL.md" $stagingRoot

          if (Test-Path $archivePath) { Remove-Item $archivePath -Force }
          # Zip the CONTENTS so Mods/ sits at the archive root, which is the
          # multi-package layout FUSE-Installer.exe already understands.
          # -ContentsOnly is the New-ModArchive equivalent of `Compress-Archive -Path dir\*`.
          .\scripts\New-ModArchive.ps1 -Path $stagingRoot -DestinationPath $archivePath -ContentsOnly

          "archive_name=$archiveName" >> $env:GITHUB_OUTPUT
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      # Provenance stamp for the update check. The core zip attached to the GitHub
      # release below stays Source="github" (the committed Info.json default); the
      # Nexus upload gets its own copy of that mod with Source re-stamped to
      # "nexus", plus the self-contained installer, so an out-of-date player who
      # installed from Nexus is pointed back to Nexus while GitHub remains
      # canonical (docs/RELEASING.md).
      #
      # GA only, and gated on NEXUS_FILE_GROUP_ID for the same reasons as the
      # upload step below — no point building the variant when it will not ship.
      - name: Package Nexus variant (Source=nexus)
        id: nexus_package
        if: ${{ vars.NEXUS_FILE_GROUP_ID != '' && steps.version.outputs.is_ga == 'true' }}
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $nexusRoot = Join-Path $PWD "staging-nexus"
          $payloadRoot = Join-Path $nexusRoot "payload"
          $modFolder = Join-Path $payloadRoot "FUSE"
          # Keep the established user-facing filename while making the Nexus
          # download an extraction-first archive containing both supported
          # installation paths.
          $archivePath = Join-Path $nexusRoot "FUSE-v$version.zip"

          if (Test-Path $nexusRoot) { Remove-Item $nexusRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $payloadRoot | Out-Null

          # Reuse the exact staged mod folder the GitHub/core zip was built and
          # validated from, so the Nexus zip can never drift from it; then flip
          # only the provenance stamp.
          Copy-Item -Recurse "staging\FUSE" $modFolder
          powershell -NoProfile -ExecutionPolicy Bypass -File "scripts\stamp-info-source.ps1" -Path (Join-Path $modFolder "Info.json") -Source nexus

          # Nexus users get the supported self-contained installer in the same
          # download. It embeds the already-validated GitHub/core payload, while
          # the adjacent FUSE folder remains available for a transparent manual
          # install and carries the Nexus provenance stamp.
          Copy-Item "dist\FUSE-Installer.exe" $payloadRoot

          # Cheap guard: the stamp is a byte-faithful regex replace, so confirm the
          # manifest still parses and actually reads "nexus" before it ships.
          $info = Get-Content -LiteralPath (Join-Path $modFolder "Info.json") -Raw | ConvertFrom-Json
          if ($info.Source -ne "nexus") { throw "Nexus variant Info.json Source is '$($info.Source)', expected 'nexus'." }

          # Pack with New-ModArchive.ps1 (forward-slash entry names), NOT
          # Compress-Archive: under Windows PowerShell 5.1 Compress-Archive writes
          # backslash entry names that break UMM's UPDATE path — the exact
          # 1.0.0-1.0.2 bug fixed for the core zip above (issue #209). Archive
          # the payload contents so FUSE/ and FUSE-Installer.exe sit at the root.
          .\scripts\New-ModArchive.ps1 -Path $payloadRoot -DestinationPath $archivePath -ContentsOnly

          # Fail closed if either installation path is missing from the artifact.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('FUSE-Installer.exe', 'FUSE/FUSE.dll', 'FUSE/Info.json', 'FUSE/LICENSE')) {
              if ($required -notin $entries) { throw "Nexus archive is missing required entry '$required'." }
            }
          }
          finally {
            $zip.Dispose()
          }
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      # Uploads one player-facing archive to the mod's Nexus Mods page. It contains
      # the core mod plus FUSE-Installer.exe, but deliberately omits the converter,
      # folder-converter, complete author bundle, and Live Bridge.
      #
      # GA tags only. Release candidates publish as full GitHub releases, so
      # is_prerelease is false for them and gating on it would push every RC to
      # the public mod page (and archiving the existing version would churn the
      # previous file each time). Nexus tracks stable releases only.
      #
      # NEXUS_FILE_GROUP_ID is a legacy variable name; its API Info value is the
      # v3 file_id used by the current upload API.
      - name: Preflight Nexus upload
        id: nexus
        if: ${{ vars.NEXUS_FILE_GROUP_ID != '' && steps.version.outputs.is_ga == 'true' }}
        shell: powershell
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_FILE_ID: ${{ vars.NEXUS_FILE_GROUP_ID }}
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File "scripts\Test-NexusFileVersion.ps1" `
            -FileId $env:NEXUS_FILE_ID `
            -Version $env:MOD_VERSION `
            -GitHubOutputPath $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FUSE v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          generate_release_notes: true
          # GitHub gets its direct-UMM core zip, plus the complete bundle and the
          # individual tools. Nexus gets the installer-inclusive archive above.
          files: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.bundle.outputs.archive_path }}
            dist/FUSE-Converter.exe
            dist/FUSE-Installer.exe
            dist/FUSEConvertFolder.pyz
            FUSE.LiveBridge-v${{ steps.version.outputs.version }}.zip

      # Skipped automatically until the repo variable NEXUS_FILE_GROUP_ID is set.
      # Requires:
      #   - variable NEXUS_FILE_GROUP_ID (from "API Info" on the mod's Files tab)
      #   - repository secret NEXUSMODS_API_KEY
      # The secret is NOT checked in this condition: `secrets` is not an
      # available context in a step-level `if`, and referencing it there is a
      # parse error that breaks the whole workflow. With the variable set but the
      # key missing, the preflight fails before either release destination is
      # mutated — so set both together.
      - name: Upload to Nexus Mods
        if: ${{ vars.NEXUS_FILE_GROUP_ID != '' && steps.version.outputs.is_ga == 'true' && steps.nexus.outputs.publish_required == 'true' }}
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          # The Source=nexus variant, not steps.package (which stays github).
          filename: ${{ steps.nexus_package.outputs.archive_path }}
          version: ${{ steps.version.outputs.version }}
          display_name: FUSE v${{ steps.version.outputs.version }}
          description: |
            Release v${{ steps.version.outputs.version }}.
            See the GitHub release for the full changelog: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
          category: main
          archive_existing_version: true
