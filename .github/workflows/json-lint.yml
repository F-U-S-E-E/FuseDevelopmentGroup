name: JSON Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR when a new commit lands.
concurrency:
  group: json-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  json-lint:
    # Runs on the same self-hosted runner as ci.yml + release.yml. The lint
    # itself only needs Python + jsonschema, but keeping every workflow on
    # one runner avoids the matrix of "do we have git available?" /
    # "do we have UMM DLLs available?" / "does actions/setup-python work
    # here?" questions every time a check is touched.
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install json_lint dependencies
        run: pip install jsonschema

      # Validates every tracked .json file in the repo (strict parse) and
      # cross-checks the canonical instance/schema pairs:
      #   FUSE/Info.json               -> schemas/umm-info.schema.json
      #   schemas/fuse-mod.example.json -> schemas/fuse-mod.schema.json
      - name: Run JSON lint
        run: python tools/json_lint.py
