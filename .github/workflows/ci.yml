name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Pass a non-default ModVersion so the InjectModVersionIntoInfoJson
      # target runs (it is gated on '$(ModVersion)' != '0.0.0'). This catches
      # regressions in the post-build PowerShell that stamps Info.json.
      - name: Build (Debug)
        run: dotnet build FUSE.csproj -c Debug -p:ModVersion=0.0.1-ci

      - name: Build (Release)
        run: dotnet build FUSE.csproj -c Release -p:ModVersion=0.0.1-ci

      - name: Verify Info.json stamped with version
        shell: powershell
        run: |
          $info = Get-Content 'bin\Release\net48\Info.json' -Raw | ConvertFrom-Json
          if ($info.Version -ne '0.0.1') { throw "Info.json Version is '$($info.Version)', expected '0.0.1' (core only)" }
          Write-Host "Manifest stamped correctly: Info.Version=$($info.Version)"
