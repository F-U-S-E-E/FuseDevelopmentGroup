name: Sync Info.json to latest release

# Keeps the source FUSE/Info.json "Version" field in step with the latest
# published GitHub release. Skipped for any tag that isn't a plain
# mod-v<MAJOR>.<MINOR>.<PATCH>, which is what excludes prereleases (-rc.1 etc.).
# The release artifact itself is already correctly stamped by the build (see
# InjectModVersionIntoInfoJson in Directory.Build.targets); this workflow only
# updates the in-repo manifest so the source-of-truth tracks the latest GA
# release.
#
# Triggered by the Release workflow completing, NOT by `release: [published]`.
# GitHub deliberately does not start new workflow runs from events created with
# the default GITHUB_TOKEN, and release.yml creates the release with exactly
# that token via softprops/action-gh-release. Under the old `release:` trigger
# this workflow therefore never ran once — not for any release through
# mod-v1.0.0 — which is why FUSE/Info.json sat at 0.0.0 while shipped artifacts
# were correctly versioned. workflow_run fires on the Release run finishing and
# also lets us gate on it having actually succeeded, so a failed build can't
# bump the manifest.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

# Serialize manifest bumps so two releases finishing close together can't race
# on the same push to main.
concurrency:
  group: sync-info-json
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3 # zizmor: ignore[artipacked]
        with:
          ref: main
          # Default GITHUB_TOKEN can push back to main; branch protections
          # that require PRs will block this and need a separate token.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately persisted (the checkout default): the final step
          # commits and pushes FUSE/Info.json back to main with this token.
          # Every other workflow in the repo sets persist-credentials: false;
          # this is the one lane that needs write access after checkout.
          persist-credentials: true

      - name: Parse semantic version from released tag
        id: version
        shell: powershell
        env:
          # Pass the tag via the environment, not template expansion, so a
          # crafted release tag name can't inject into the script before
          # validation. Mirrors the TAG_NAME hardening in release.yml.
          # For a tag-triggered Release run, head_branch is the tag name.
          TAG_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^mod-v(?<version>[0-9]+\.[0-9]+\.[0-9]+)$') {
            Write-Host "Release tag '$tag' is not a 3-part GA mod-v semver; skipping sync."
            "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT
          "skip=false" >> $env:GITHUB_OUTPUT

      - name: Stamp FUSE/Info.json
        if: steps.version.outputs.skip == 'false'
        shell: powershell
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          .\scripts\stamp-info-version.ps1 -Path FUSE\Info.json -Version "$env:MOD_VERSION"

      - name: Commit and push
        if: steps.version.outputs.skip == 'false'
        shell: powershell
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:MOD_VERSION
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $status = git status --porcelain FUSE/Info.json
          if (-not $status) {
            Write-Host "FUSE/Info.json already at v$version; nothing to commit."
            exit 0
          }

          git add FUSE/Info.json
          # [skip ci] keeps this metadata bump from re-running the full CI
          # build matrix; the verify-stamping check is exercised on every
          # other push so we don't lose coverage.
          git commit -m "Sync FUSE/Info.json Version to $version [skip ci]"
          git push origin main
